llm:
  provider: mock

permission:
  auto-allow: true

agent:
  context:
    window-size: 200000
    compression:
      level1-threshold: 0.7
      level2-threshold: 0.85
      level3-threshold: 0.95
  react:
    enabled: false
    max-iterations: 10
  routing:
    enabled: false
    use-llm: false
  rag:
    advanced:
      enabled: true
      use-hyde: true
      use-reranker: false
      bm25-weight: 1.0
      vector-weight: 1.0
  mcp:
    servers: []
