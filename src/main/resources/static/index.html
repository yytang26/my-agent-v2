<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Agent</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>My Agent</h1>
                <button id="new-session-btn" class="btn-primary">+ 新会话</button>
            </div>
            <div id="session-list" class="session-list"></div>
            <div class="sidebar-footer">
                <div id="cost-info" class="cost-info">--</div>
            </div>
        </aside>
        <main class="chat-area">
            <div id="messages" class="messages"></div>
            <div class="input-area">
                <textarea id="message-input" placeholder="输入消息... (Ctrl+Enter 发送)" rows="2"></textarea>
                <button id="send-btn" class="btn-send">发送</button>
            </div>
        </main>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
