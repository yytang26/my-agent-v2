agent:
  workspace-root: ${user.dir}
  sessions-dir: ${user.home}/.my-agent/sessions
  streaming: true
  loop:
    max-iterations: 10
  react:
    enabled: false
    max-iterations: 10
  routing:
    enabled: false
    use-llm: false
  context:
    window-size: 200000
    compression:
      level1-threshold: 0.7
      level2-threshold: 0.85
      level3-threshold: 0.95
  rag:
    advanced:
      enabled: true
      use-hyde: true
      use-reranker: false
      bm25-weight: 1.0
      vector-weight: 1.0

llm:
  provider: claude  # claude | openai | mock

claude:
  api-key: ${CLAUDE_API_KEY:}
  base-url: https://api.anthropic.com
  model: claude-sonnet-4-20250514
  max-tokens: 1024
