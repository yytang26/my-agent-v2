server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:${user.home}/.my-agent/data/agentdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n"

agent:
  mode: web
  workspace-root: ${user.dir}
  sessions-dir: ${user.home}/.my-agent/sessions
  streaming: true
  loop:
    max-iterations: 10
  react:
    enabled: false
    max-iterations: 10
  routing:
    enabled: false
    use-llm: false
  context:
    window-size: 200000
    compression:
      level1-threshold: 0.7
      level2-threshold: 0.85
      level3-threshold: 0.95
  rag:
    advanced:
      enabled: true
      use-hyde: true
      use-reranker: false
      bm25-weight: 1.0
      vector-weight: 1.0
  mcp:
    servers:
      # 示例配置（默认为空列表）
      # - name: "filesystem"
      #   command: "npx"
      #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
      #   transport-type: "stdio"
  security:
    injection-detection: true
    sandbox-enabled: true
    risk-threshold: 0.7
    blocked-commands:
      - "rm -rf /"
      - "mkfs"
      - "dd if=/dev/zero"

llm:
  provider: claude  # claude | openai | mock

claude:
  api-key: ${CLAUDE_API_KEY:}
  base-url: https://api.anthropic.com
  model: claude-sonnet-4-20250514
  max-tokens: 1024
